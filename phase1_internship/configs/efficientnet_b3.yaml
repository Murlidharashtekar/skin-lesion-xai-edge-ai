seed: 42

model:
  name: efficientnet_b3
  pretrained: true
  num_classes: 7

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 2

scheduler:
  type: reduce_on_plateau
  factor: 0.5
  patience: 2

early_stopping:
  patience: 5

paths:
  train_csv: data/splits/train.csv
  val_csv: data/splits/validation.csv
  image_dir: data/raw/ham10000/images
  checkpoint_dir: phase1_internship/outputs/checkpoints
  metrics_dir: phase1_internship/outputs/metrics